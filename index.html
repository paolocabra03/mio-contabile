<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mio Contabile</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contabile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app a schermo intero; contenuto che scorre sopra una barra fissa in basso con il "+" rialzato; i moduli si aprono come fogli dal basso. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --line:#D5DDD8; --line-soft:#E3E8E5;
  --fg:#16201B; --muted:#5B6862;
  --accent:#1E5C48; --accent-ink:#FFFFFF; --accent-soft:#D7E8E0; --on-accent-muted:#CFE3DA;
  --hero:#1E5C48; --pos:#1E6B4F; --neg:#A8442A;
  --s1:#3D6FB0; --s2:#C9682A;
  --scrim:rgba(18,26,22,.55); --shadow:rgba(20,60,45,.30);
  --f-display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --line:#2B3632; --line-soft:#232D29;
  --fg:#E5ECE8; --muted:#97A59E;
  --accent:#5DB592; --accent-ink:#0B1411; --accent-soft:#1D3229; --on-accent-muted:#BFD9CD;
  --hero:#1E5C48; --pos:#6CC49A; --neg:#E58A6E;
  --s1:#5A8BD4; --s2:#CF783A;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100%;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.round-btn{width:44px;height:44px;flex:0 0 44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.round-btn svg{width:18px;height:18px}
.round-btn[disabled]{opacity:.35;cursor:default}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--hero);color:#FFFFFF;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow,.hero .sub{color:var(--on-accent-muted)}
.eye{width:44px;height:44px;flex:0 0 44px;margin:-8px -8px 0 0;border:none;border-radius:22px;background:rgba(255,255,255,.12);color:#FFFFFF;display:grid;place-items:center}
.eye svg{width:20px;height:20px}
.big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile span{font-size:11.5px;color:var(--on-accent-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-weight:600;font-size:14px;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio b{font-weight:600;font-size:17px;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.split{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block}
.link{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}

/* lista movimenti */
.list{display:flex;flex-direction:column}
.day{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 2px;border-top:1px solid var(--line-soft)}
.day:first-child{border-top:none}
.mv{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0}
.mv + .mv{border-top:1px solid var(--line-soft)}
.badge{width:36px;height:36px;border-radius:11px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
.badge.in{background:var(--accent-soft);color:var(--accent)}
.badge svg{width:18px;height:18px}
.mv .t{display:flex;flex-direction:column;min-width:0}
.mv .t b{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.mv .t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .a{font-weight:600;white-space:nowrap}
.mv .a.tr{color:var(--muted)}
.pend{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--s2);border:1px solid currentColor;border-radius:5px;padding:0 4px;line-height:15px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .label{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:capitalize}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{border:none;background:transparent;font-size:16px;padding:11px 0;width:100%;min-width:0;color:var(--fg);outline:none}
.search svg{width:18px;height:18px;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* grafici */
.chart{display:flex;gap:6px}
.yax{width:28px;height:110px;display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--muted);text-align:right;margin-top:-6px}
.plot{flex:1;position:relative;height:110px;display:flex;align-items:flex-end}
.plot .g{position:absolute;left:0;right:0;border-top:1px dashed var(--line-soft)}
.plot .base{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--line)}
.col{flex:1;height:100%;display:flex;justify-content:center;align-items:flex-end;gap:2px;background:none;border:none;padding:0;position:relative;z-index:1}
.col[aria-pressed="true"]{background:var(--line-soft);border-radius:6px 6px 0 0}
.bar{display:block;border-radius:4px 4px 0 0}
.xax{display:flex;padding-left:34px;font-size:11px;color:var(--muted)}
.xax span{flex:1;text-align:center}
.xax .on{color:var(--fg);font-weight:600}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.hbar .tr i{display:block;background:var(--accent);border-radius:0 4px 4px 0}

/* PAC */
.etf{display:flex;flex-direction:column;gap:6px}
.etf + .etf{padding-top:12px;border-top:1px solid var(--line-soft)}
.etf .nm{font-weight:600}
.kv4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv4 div{display:flex;flex-direction:column;gap:1px}
.kv4 b{font-weight:600}
.btn{border:none;border-radius:14px;padding:15px;font-weight:600;font-size:16px;background:var(--hero);color:#FFFFFF;width:100%;min-height:50px}
.btn.ghost{background:var(--sunk);color:var(--fg);font-size:15px;padding:12px;min-height:44px}
.btn[disabled]{opacity:.55}

/* barra in basso */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;height:64px;padding-top:8px}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:0;min-height:44px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.plus{justify-self:center;width:54px;height:54px;margin-top:-22px;border-radius:18px;border:none;background:var(--hero);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 6px 16px var(--shadow)}
.plus svg{width:26px;height:26px}

/* foglio dal basso */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:24px 24px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(20px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:var(--sunk);border-radius:12px;padding:3px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg button{border:none;border-radius:9px;padding:9px 4px;font-weight:600;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--f-display);font-size:32px;color:var(--muted)}
.amount input{border:none;background:transparent;font-family:var(--f-display);font-weight:700;font-size:46px;width:100%;min-width:0;padding:0;color:var(--fg);outline:none}
.field{display:flex;flex-direction:column;gap:8px}
.field > .lab,.field > label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 10px;font-size:16px;color:var(--fg);min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.pair{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.err{color:var(--neg);font-size:13.5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}

.banner{border:1px solid var(--neg);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:30;background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;font-size:14px;width:max-content;max-width:calc(100% - 40px)}
.toast button{background:none;border:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}

/* accesso */
.welcome{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.welcome .logo{width:72px;height:72px;border-radius:18px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;font-size:16px;min-height:52px}
.gbtn svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<nav class="nav" id="nav" aria-label="Sezioni" hidden>
  <div class="nav-in">
    <button class="tab" data-tab="home"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-tab="mov"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Movimenti</button>
    <button class="plus" id="openAdd" aria-label="Nuovo movimento"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="charts"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Grafici</button>
    <button class="tab" data-tab="pac"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>PAC</button>
  </div>
</nav>
<div id="overlay"></div>
<div id="toastHost"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
